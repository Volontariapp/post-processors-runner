# Dependabot PRs carry docker-e2e and docker-and-e2e (the latter is required by the CI). Source: Volontariapp/ci-tools templates/dependabot.
# Keep `directories` in sync with the `services` input of .github/workflows/ci.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/post-processor-event"
      - "/post-processor-post"
      - "/post-processor-ranking"
      - "/post-processor-social"
      - "/post-processor-storage"
      - "/post-processor-user"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One pull request for every version update across all sub-packages (@volontariapp/* included).
      runner-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/post-processor-event"
      - "/post-processor-post"
      - "/post-processor-ranking"
      - "/post-processor-social"
      - "/post-processor-storage"
      - "/post-processor-user"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      docker-dependencies:
        patterns:
          - "*"
