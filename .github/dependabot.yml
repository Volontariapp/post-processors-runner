# Dependabot PRs carry docker-e2e and docker-and-e2e (the latter is required by the CI). Source: Volontariapp/ci-tools templates/dependabot.
# Keep `directories` in sync with the `services` input of .github/workflows/ci.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/post-processor-event"
      - "/post-processor-post"
      - "/post-processor-ranking"
      - "/post-processor-social"
      - "/post-processor-storage"
      - "/post-processor-user"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # A single pull request per week for every version update (majors and @volontariapp/* included):
      # the E2E suite runs once instead of once per dependency.
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own pull request so they are never held back by a risky major bump.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/post-processor-event"
      - "/post-processor-post"
      - "/post-processor-ranking"
      - "/post-processor-social"
      - "/post-processor-storage"
      - "/post-processor-user"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      docker-dependencies:
        patterns:
          - "*"
