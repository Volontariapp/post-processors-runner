name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci:
    uses: Volontariapp/ci-tools/.github/workflows/runner-pipeline.yml@main
    permissions:
      contents: read
      packages: write
    with:
      service-name: post-processors-runner
      services: '["post-processor-user", "post-processor-event", "post-processor-post", "post-processor-social"]'
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
